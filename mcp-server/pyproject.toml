[project]
name = "a-share-mcp"
version = "0.1.0"
description = "A-Share Market MCP Server for Chinese Stock Market Analysis"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.0.0",
    "baostock>=0.9.3",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "requests>=2.28.0",
    "beautifulsoup4>=4.12.0",
    "httpx>=0.24.0",
    "httpx-sse>=0.3.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "rich>=13.0.0",
    "tabulate>=0.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
